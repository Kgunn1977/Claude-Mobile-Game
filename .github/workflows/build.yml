name: build-apk

# Build a debug APK on every push, upload it as an artifact, and publish it as a
# GitHub Release so the in-app "Get the latest build" button can reach it.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Generate the Android platform folder, then restore our authored files so
      # our code + dependencies always win.
      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.example --project-name colony_game .

      - name: Restore authored files
        run: git checkout -- pubspec.yaml analysis_options.yaml lib

      - name: Stamp build number
        run: sed -i "s/kBuildNumber = 0/kBuildNumber = ${{ github.run_number }}/" lib/version.dart

      # Add internet + install-packages permissions and the url_launcher queries.
      - name: Patch Android manifest
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'REQUEST_INSTALL_PACKAGES' not in s:
              inject = (
                  '\n    <uses-permission android:name="android.permission.INTERNET"/>'
                  '\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
                  '\n    <queries><intent><action android:name="android.intent.action.VIEW"/>'
                  '<data android:scheme="https"/></intent></queries>')
              s = re.sub(r'(<manifest\b[^>]*>)', r'\1' + inject, s, count=1)
              open(p, 'w').write(s)
              print('manifest patched')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Publish release (latest installable APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: build/app/outputs/flutter-apk/app-debug.apk
