<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>SIGNAL // Meridian</title>
<link rel="stylesheet" href="game.css" />
</head>
<body>
  <div id="stars"></div>

  <!-- ===== Title screen ===== -->
  <section id="title" class="screen active">
    <div class="title-wrap">
      <div class="logo">
        <span class="logo-main">SIGNAL</span>
        <span class="logo-sub">// THE MERIDIAN INCIDENT</span>
      </div>
      <p class="tagline">A drifting research vessel. A crew that vanished. A voice in the dark that knows your name.</p>
      <div class="title-buttons">
        <button class="btn btn-primary" id="btn-new">New Game</button>
        <button class="btn" id="btn-continue">Continue</button>
        <button class="btn btn-ghost" id="btn-about">About</button>
      </div>
      <p class="version">v1.0 · save persists on this device</p>
    </div>
  </section>

  <!-- ===== Character creation ===== -->
  <section id="creation" class="screen">
    <div class="panel">
      <h1 class="panel-title">PERSONNEL FILE</h1>
      <p class="muted">Cryo-revival protocol incomplete. Confirm your identity to continue.</p>

      <label class="field-label">Name on file</label>
      <input id="name-input" class="text-input" type="text" maxlength="18" placeholder="Enter name" autocomplete="off" />

      <label class="field-label">Specialization <span class="muted">— shapes how you survive</span></label>
      <div id="class-list" class="class-list"></div>

      <div class="creation-footer">
        <button class="btn" id="btn-back-title">Back</button>
        <button class="btn btn-primary" id="btn-begin" disabled>Begin</button>
      </div>
    </div>
  </section>

  <!-- ===== Main game ===== -->
  <section id="game" class="screen">
    <header id="hud">
      <button id="hud-menu" class="hud-icon" aria-label="Menu">☰</button>
      <div class="hud-stats">
        <div class="stat" title="Health"><span class="stat-icon">✚</span><span id="hud-hp">100</span></div>
        <div class="stat" title="Composure"><span class="stat-icon">◈</span><span id="hud-comp">100</span></div>
      </div>
      <button id="hud-inv" class="hud-icon" aria-label="Inventory">▣</button>
    </header>

    <main id="story">
      <div id="scene-art" class="scene-art"></div>
      <div id="scene-text" class="scene-text"></div>
      <div id="choices" class="choices"></div>
    </main>
  </section>

  <!-- ===== Overlay (menu / inventory / character) ===== -->
  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-head">
        <h2 id="overlay-title">Menu</h2>
        <button id="overlay-close" class="hud-icon" aria-label="Close">✕</button>
      </div>
      <div id="overlay-body" class="overlay-body"></div>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div id="toast" class="toast"></div>

  <script src="story.js"></script>
  <script src="game.js"></script>
</body>
</html>
